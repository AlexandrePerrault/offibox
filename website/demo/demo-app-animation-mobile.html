<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Démo Offibox – Mobile (paysage = barre étendue)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spinnaker&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --offi-teal: #5A9094;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      font-family: 'Spinnaker', sans-serif;
      background: transparent;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    .demo-wrap {
      width: 100%;
      max-width: 100vw;
      min-height: 280px;
      padding: 0.75rem;
      position: relative;
    }
    .app-bar-outer {
      position: relative;
      width: 100%;
      max-width: 100%;
      display: flex;
      justify-content: flex-end;
      z-index: 10;
    }
    .app-bar-container {
      position: relative;
      width: 56px;
      min-width: 56px;
      height: 56px;
      min-height: 56px;
      border-radius: 18px;
      background: var(--white);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: width .35s ease-out, min-height .35s ease-out, border-radius .3s ease-out;
      transform-origin: right center;
    }
    .app-bar-container.expanded,
    .app-bar-container.landscape-expanded {
      width: 100%;
      min-height: 64px;
      height: auto;
      border-radius: 14px;
      justify-content: flex-start;
      flex-direction: row;
      align-items: stretch;
    }
    /* En paysage : barre étendue par défaut */
    @media (orientation: landscape) {
      .demo-wrap { min-height: 220px; padding: 0.5rem; }
      .app-bar-outer { justify-content: stretch; }
      .app-bar-container {
        width: 100%;
        min-height: 60px;
        height: auto;
        border-radius: 14px;
        flex-direction: row;
        align-items: stretch;
      }
      .app-bar-container .bar-expanded-content {
        display: flex !important;
      }
    }
    .bar-pill-only {
      position: absolute;
      right: 0;
      top: 0;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    .app-bar-container.expanded .bar-pill-only,
    .app-bar-container.landscape-expanded .bar-pill-only {
      position: absolute;
    }
    .bar-pill-only .logo-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      display: block;
    }
    .bar-expanded-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      margin-right: 56px;
      padding: 6px 8px 8px;
    }
    .app-bar-container.expanded .bar-expanded-content,
    .app-bar-container.landscape-expanded .bar-expanded-content {
      display: flex;
    }
    .info-bar {
      height: 34px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      border-radius: 8px;
      margin: 0 0 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      flex-shrink: 0;
    }
    .info-bar-toggle {
      width: 24px;
      height: 14px;
      background: #34C759;
      border-radius: 7px;
      flex-shrink: 0;
      border: 1.5px solid #fff;
      position: relative;
    }
    .info-bar-toggle::before {
      content: '';
      position: absolute;
      top: 1px;
      left: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
      transition: transform .2s ease-out;
    }
    .info-bar-toggle.off { background: #cbd5e1; }
    .info-bar-toggle.off::before { transform: translateX(6px); }
    .info-bar-date {
      height: 18px;
      padding: 2px 6px;
      background: #37474F;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .info-bar-infos {
      height: 18px;
      padding: 2px 6px;
      background: #4E8A72;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .info-bar-scroll {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }
    .info-bar-scroll-inner {
      display: flex;
      align-items: center;
      gap: 2px;
      animation: ticker-scroll 25s linear infinite;
    }
    .ticker-bullet { color: #94a3b8; font-size: 8px; padding: 0 2px; flex-shrink: 0; }
    .ticker-badge {
      height: 18px;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ticker-badge.dgs   { background: #B71C1C; }
    .ticker-badge.ansm  { background: #1565C0; }
    .ticker-badge.rappel { background: #B71C1C; }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .search-bar-expanded {
      min-height: 0;
      padding: 6px 0 0;
    }
    .search-input {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
      min-width: 0;
    }
    .hint-landscape {
      margin-top: 0.5rem;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
    @media (orientation: landscape) {
      .hint-landscape { display: none; }
    }
  </style>
</head>
<body>
  <div class="demo-wrap" id="demo-wrap">
    <div class="app-bar-outer">
      <div class="app-bar-container" id="app-bar-container">
        <div class="bar-pill-only" id="bar-pill" role="button" aria-label="Ouvrir la barre">
          <img id="demo-logo-img" data-src="../logo%20sans%20texte.png" alt="Offibox" class="logo-img" referrerpolicy="no-referrer" src="">
        </div>
        <div class="bar-expanded-content">
          <div class="info-bar">
            <div class="info-bar-toggle" id="info-toggle" role="button" aria-label="Infos on/off"></div>
            <div class="info-bar-date" id="info-bar-date"></div>
            <div class="info-bar-infos">INFOS</div>
            <div class="info-bar-scroll">
              <div class="info-bar-scroll-inner" id="ticker-inner">
                <span class="ticker-badge dgs">DGS-Urgent</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge ansm">ANSM – Informations de sécurité</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge rappel">Rappel produit</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge dgs">DGS-Urgent</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge ansm">ANSM</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge rappel">Rappel produit</span>
                <span class="ticker-bullet">•</span>
              </div>
            </div>
          </div>
          <div class="search-bar-expanded">
            <input type="text" class="search-input" id="search-input" placeholder="Rechercher…" readonly>
          </div>
        </div>
      </div>
    </div>
    <p class="hint-landscape">Tournez l’appareil en paysage pour voir la barre étendue.</p>
  </div>

  <script>
  (function() {
    var docBase = (function() {
      var href = window.location.href;
      var lastSlash = href.lastIndexOf('/');
      return lastSlash >= 0 ? href.slice(0, lastSlash + 1) : href + '/';
    })();
    function assetUrl(relativePath) {
      if (!relativePath) return '';
      try { return new URL(relativePath, docBase).href; } catch (e) { return relativePath; }
    }
    var logoImg = document.getElementById('demo-logo-img');
    if (logoImg && logoImg.getAttribute('data-src')) logoImg.src = assetUrl(logoImg.getAttribute('data-src'));

    var barContainer = document.getElementById('app-bar-container');
    var barPill = document.getElementById('bar-pill');
    var infoToggle = document.getElementById('info-toggle');
    var infoDate = document.getElementById('info-bar-date');

    function updateDate() {
      if (!infoDate) return;
      var d = new Date();
      var day = ('0' + d.getDate()).slice(-2);
      var month = ('0' + (d.getMonth() + 1)).slice(-2);
      var year = d.getFullYear();
      var h = ('0' + d.getHours()).slice(-2);
      var m = ('0' + d.getMinutes()).slice(-2);
      var s = ('0' + d.getSeconds()).slice(-2);
      infoDate.textContent = day + '/' + month + '/' + year + '  ' + h + ':' + m + ':' + s;
    }
    updateDate();
    setInterval(updateDate, 1000);

    function isLandscape() {
      return window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
    }

    function applyOrientation() {
      if (isLandscape()) {
        barContainer.classList.add('landscape-expanded');
        barContainer.classList.remove('expanded');
      } else {
        barContainer.classList.remove('landscape-expanded');
      }
    }

    if (barPill) {
      barPill.addEventListener('click', function() {
        if (isLandscape()) return;
        barContainer.classList.toggle('expanded');
      });
    }
    if (infoToggle) {
      infoToggle.addEventListener('click', function() {
        infoToggle.classList.toggle('off');
      });
    }

    if (window.matchMedia) {
      window.matchMedia('(orientation: landscape)').addEventListener('change', applyOrientation);
    }
    window.addEventListener('orientationchange', function() {
      setTimeout(applyOrientation, 50);
    });
    applyOrientation();
  })();
  </script>
</body>
</html>

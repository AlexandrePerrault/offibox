<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démo Offibox – Ouverture URL Qare (prescription / QR code)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spinnaker&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --offi-teal: #5A9094;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Spinnaker', sans-serif;
      background: transparent;
      min-height: 100vh;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .demo-wrap {
      max-width: 1200px;
      width: 100%;
      background: transparent;
      overflow: visible;
      position: relative;
      min-height: 420px;
      padding: 0;
      margin: 0;
    }
    .app-bar-outer {
      position: absolute;
      top: 0;
      right: 0;
      left: auto;
      width: 92%;
      padding: 0;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
    }
    .app-bar-container {
      position: relative;
      width: 60px;
      height: 60px;
      min-height: 60px;
      border-radius: 22px;
      background: var(--white);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 4px 10px rgba(0,0,0,.14), 0 -1px 3px rgba(255,255,255,.03);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: width .5s ease-out, height .5s ease-out, min-height .5s ease-out, border-radius .35s ease-out;
      transform-origin: right center;
    }
    .app-bar-container.expanded {
      width: 100%;
      min-height: 68px;
      height: auto;
      border-radius: 15px;
      justify-content: flex-start;
      flex-direction: row;
      align-items: stretch;
    }
    .bar-pill-only {
      position: absolute;
      right: 0;
      top: 0;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      pointer-events: auto;
    }
    .bar-pill-only .logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
    }
    .bar-expanded-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      margin-right: 60px;
    }
    .app-bar-container.expanded .bar-expanded-content {
      display: flex;
      animation: barContentSlideIn 0.4s ease-out forwards;
    }
    @keyframes barContentSlideIn {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .info-bar {
      height: 38px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border-radius: 8px;
      margin: 0 0 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .info-bar-toggle {
      width: 27px;
      height: 17px;
      background: #34C759;
      border-radius: 9px;
      flex-shrink: 0;
      border: 1.5px solid #fff;
      box-shadow: 0 0 0 1px rgba(15,23,42,.18) inset;
    }
    .info-bar-date {
      height: 19px;
      padding: 2.5px 8px;
      background: #37474F;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .info-bar-infos {
      height: 19px;
      padding: 2.5px 8px;
      background: #4E8A72;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .info-bar-scroll { flex: 1; overflow: hidden; min-width: 0; }
    .info-bar-scroll-inner {
      display: flex;
      align-items: center;
      gap: 4px;
      animation: ticker-scroll 28s linear infinite;
    }
    .ticker-bullet { color: #94a3b8; font-size: 9px; padding: 0 4px; flex-shrink: 0; }
    .ticker-badge {
      height: 19px;
      padding: 2.5px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ticker-badge.dgs   { background: #B71C1C; }
    .ticker-badge.ansm  { background: #1565C0; }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .search-bar-expanded {
      min-height: 118px;
      background: transparent;
      padding: 12px 0 8px;
    }
    .search-input {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .search-input.hidden { display: none; }

    .browser-panel {
      margin: 8px 0 12px 0;
      width: 100%;
      display: none;
      flex-direction: column;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .browser-panel.visible { display: flex; }
    .browser-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      min-height: 44px;
    }
    .browser-toolbar .url-bar {
      flex: 1;
      font-size: 12px;
      color: var(--offi-teal);
      word-break: break-all;
      min-width: 0;
      text-decoration: none;
    }
    .browser-toolbar .url-bar:hover { text-decoration: underline; }
    .browser-frame-wrap {
      width: 100%;
      height: 520px;
      background: #f8fafc;
    }
    .browser-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .browser-frame-fallback {
      display: none;
      width: 100%;
      height: 100%;
      padding: 24px;
      background: #f8fafc;
      color: #64748b;
      font-size: 13px;
      box-sizing: border-box;
    }
    .browser-panel.iframe-blocked .browser-frame-wrap iframe { display: none; }
    .browser-panel.iframe-blocked .browser-frame-fallback { display: block; }
    .browser-frame-fallback a { color: var(--offi-teal); }

    .fake-cursor {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--offi-teal);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      pointer-events: none;
      z-index: 100;
      transition: transform .12s ease-out;
    }
    .fake-cursor.click {
      transform: scale(0.7);
      box-shadow: 0 0 0 3px rgba(90,144,148,.4);
    }
  </style>
</head>
<body>
  <div class="demo-wrap" id="demo-wrap">
    <div class="app-bar-outer">
      <div class="app-bar-container" id="app-bar-container">
        <div class="bar-pill-only" id="bar-pill">
          <img id="demo-logo-img" data-src="../logo%20sans%20texte.png" alt="Offibox" class="logo-img" referrerpolicy="no-referrer" src="">
        </div>
        <div class="bar-expanded-content">
          <div class="info-bar">
            <div class="info-bar-toggle"></div>
            <div class="info-bar-date" id="info-bar-date"></div>
            <div class="info-bar-infos">INFOS</div>
            <div class="info-bar-scroll">
              <div class="info-bar-scroll-inner">
                <span class="ticker-badge dgs">DGS-Urgent</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge ansm">ANSM – Informations de sécurité</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge dgs">DGS-Urgent</span>
                <span class="ticker-bullet">•</span>
                <span class="ticker-badge ansm">ANSM – Informations de sécurité</span>
                <span class="ticker-bullet">•</span>
              </div>
            </div>
          </div>
          <div class="search-bar-expanded">
            <input type="text" class="search-input" id="search-input" placeholder="Rechercher ou coller une URL…" readonly>
            <div class="browser-panel" id="browser-panel">
              <div class="browser-toolbar">
                <a id="browser-url-bar" class="url-bar" href="#" target="_blank" rel="noopener noreferrer"></a>
              </div>
              <div class="browser-frame-wrap">
                <iframe id="browser-frame" title="Page Qare – prescription / QR code"></iframe>
                <div class="browser-frame-fallback" id="browser-frame-fallback">
                  <p style="margin-bottom:12px;">Le site peut refuser l’affichage dans un cadre (politique de sécurité).</p>
                  <p><a id="browser-fallback-link" href="#" target="_blank" rel="noopener noreferrer">Ouvrir le lien dans un nouvel onglet</a></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function() {
    var demoUrl = 'https://www.qare.fr/prescriptions/699c41f2dca2c90030c24f0c/qrcode?secret=0.rjzx41z3gob';
    var wrap = document.getElementById('demo-wrap');
    var docBase = (function() {
      var href = window.location.href;
      var lastSlash = href.lastIndexOf('/');
      return lastSlash >= 0 ? href.slice(0, lastSlash + 1) : href + '/';
    })();
    function assetUrl(relativePath) {
      if (!relativePath) return '';
      try { return new URL(relativePath, docBase).href; } catch (e) { return relativePath; }
    }

    var logoImg = document.getElementById('demo-logo-img');
    if (logoImg && logoImg.getAttribute('data-src')) logoImg.src = assetUrl(logoImg.getAttribute('data-src'));
    var barContainer = document.getElementById('app-bar-container');
    var barPill = document.getElementById('bar-pill');
    var searchInput = document.getElementById('search-input');
    var browserPanel = document.getElementById('browser-panel');
    var browserUrlBar = document.getElementById('browser-url-bar');
    var browserFrame = document.getElementById('browser-frame');
    var browserFrameFallback = document.getElementById('browser-frame-fallback');
    var browserFallbackLink = document.getElementById('browser-fallback-link');
    var animFactor = 1.1;
    function d(ms) { return Math.round(ms * animFactor); }
    var infoDate = document.getElementById('info-bar-date');

    var resizeTimeout;
    function notifyParentHeight() {
      if (window.self === window.top) return;
      var h = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: 'offibox-demo-resize', height: h }, '*');
    }
    function scheduleNotifyParentHeight() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(notifyParentHeight, 100);
    }
    if (wrap && typeof ResizeObserver !== 'undefined') {
      var ro = new ResizeObserver(scheduleNotifyParentHeight);
      ro.observe(wrap);
    }
    setTimeout(notifyParentHeight, 200);

    if (infoDate) {
      function updateDate() {
        var d = new Date();
        var day = ('0' + d.getDate()).slice(-2);
        var month = ('0' + (d.getMonth() + 1)).slice(-2);
        var year = d.getFullYear();
        var h = ('0' + d.getHours()).slice(-2);
        var m = ('0' + d.getMinutes()).slice(-2);
        var s = ('0' + d.getSeconds()).slice(-2);
        infoDate.textContent = day + '/' + month + '/' + year + '  ' + h + ':' + m + ':' + s;
      }
      updateDate();
      setInterval(updateDate, 1000);
    }

    browserUrlBar.href = demoUrl;
    browserUrlBar.textContent = demoUrl;
    browserFallbackLink.href = demoUrl;

    var cursor = document.createElement('div');
    cursor.className = 'fake-cursor';
    wrap.appendChild(cursor);
    var cursorRadius = 7;
    function setCursorPos(x, y) {
      cursor.style.left = (x - cursorRadius) + 'px';
      cursor.style.top = (y - cursorRadius) + 'px';
    }

    function animateCursorCurved(fromX, fromY, toX, toY, duration, onEnd) {
      var ctrlX = (fromX + toX) / 2 + 45;
      var ctrlY = Math.min(fromY, toY) - 35;
      var startTime = null;
      function step(ts) {
        if (!startTime) startTime = ts;
        var t = Math.min((ts - startTime) / duration, 1);
        var u = 1 - t;
        var x = u * u * fromX + 2 * u * t * ctrlX + t * t * toX;
        var y = u * u * fromY + 2 * u * t * ctrlY + t * t * toY;
        setCursorPos(x, y);
        if (t < 1) requestAnimationFrame(step);
        else if (onEnd) onEnd();
      }
      requestAnimationFrame(step);
    }

    function cursorClick(callback) {
      cursor.classList.add('click');
      setTimeout(function() {
        cursor.classList.remove('click');
        if (callback) callback();
      }, d(150));
    }

    function expandBar() {
      barContainer.classList.add('expanded');
      setTimeout(scheduleNotifyParentHeight, d(500));
    }

    var typeSpeed = 55;
    function typewriter(text, onChar, onComplete) {
      var i = 0;
      function tick() {
        if (i <= text.length) {
          if (onChar) onChar(text.slice(0, i));
          i++;
          if (i <= text.length) setTimeout(tick, typeSpeed);
          else if (onComplete) setTimeout(onComplete, d(400));
        }
      }
      tick();
    }

    function showBrowserPanel() {
      searchInput.classList.add('hidden');
      browserPanel.classList.add('visible');
      browserFrame.src = demoUrl;
      scheduleNotifyParentHeight();
      setTimeout(function() {
        try {
          if (browserFrame.contentWindow && browserFrame.contentWindow.location.href === 'about:blank')
            browserPanel.classList.add('iframe-blocked');
        } catch (e) {
          browserPanel.classList.add('iframe-blocked');
        }
      }, 2000);
    }

    function getCenterInWrap(el) {
      var wrapRect = wrap.getBoundingClientRect();
      var rect = el.getBoundingClientRect();
      return {
        x: rect.left - wrapRect.left + rect.width / 2,
        y: rect.top - wrapRect.top + rect.height / 2
      };
    }

    function runSequence() {
      var logoCenter = getCenterInWrap(barPill);
      var startX = logoCenter.x - 40;
      var startY = logoCenter.y - 20;
      setCursorPos(startX, startY);

      setTimeout(function() {
        var pillCenter = getCenterInWrap(barPill);
        animateCursorCurved(startX, startY, pillCenter.x, pillCenter.y, d(900), function() {
          cursorClick(function() {
            expandBar();
            setTimeout(function() {
              typewriter(demoUrl, function(val) {
                searchInput.value = val;
              }, function() {
                showBrowserPanel();
              });
            }, d(800));
          });
        });
      }, d(990));
    }

    runSequence();
  })();
  </script>
</body>
</html>

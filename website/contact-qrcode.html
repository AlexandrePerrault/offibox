<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code contact - Alexandre Perrault</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    h1 { font-size: 1.25rem; color: #333; margin-bottom: 0.5rem; }
    p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    #qrcode { padding: 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    #qrcode img { display: block; }
    a.dl {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #5A9094;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    a.dl:hover { background: #4a7a7e; }
    .back-accueil { display: inline-block; margin-bottom: 1rem; color: #5A9094; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
    .back-accueil:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <p><a href="login-wix.html" class="back-accueil">← Retour à l'accueil</a></p>
  <h1>Alexandre Perrault</h1>
  <p>Scannez le QR code pour ajouter ce contact (iPhone ou Android)</p>
  <div id="qrcode"></div>
  <a href="#" class="dl" id="download" download="contact-alexandre-perrault.png">Télécharger l’image</a>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function() {
      // vCard 3.0 – compatible iPhone & Android (TEL sans espaces)
      var vCard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Alexandre Perrault',
        'N:Perrault;Alexandre;;;',
        'TEL;TYPE=CELL:0664418327',
        'END:VCARD'
      ].join('\r\n');

      var container = document.getElementById('qrcode');
      var downloadLink = document.getElementById('download');

      QRCode.toCanvas(vCard, { width: 280, margin: 2 }, function(err, canvas) {
        if (err) { container.textContent = 'Erreur: ' + err; return; }
        container.appendChild(canvas);
        canvas.toBlob(function(blob) {
          if (blob) downloadLink.href = URL.createObjectURL(blob);
        }, 'image/png');
      });
    })();
  </script>
</body>
</html>

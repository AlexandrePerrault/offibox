<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Offibox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --accent: #38bdf8;
      --accent-soft: #7dd3fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --white: #ffffff;
      --gray: #334155;
      --gray-light: #e2e8f0;
      --offi-teal: #5A9094;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
    }

    /* ----- Partie gauche (même style que page d'accueil) ----- */
    .login-left {
      flex: 1;
      background: var(--bg-dark);
      padding: 3rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-left a {
      display: inline-block;
      margin-bottom: 3rem;
    }
    .login-left img {
      height: 36px;
      width: auto;
    }
    .login-left h1 {
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 1rem;
    }
    .login-left h1 .highlight { color: var(--accent); }
    .login-left p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 380px;
      line-height: 1.7;
    }
    .login-visual {
      margin-top: 3rem;
      width: 200px;
      height: 200px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(15, 23, 42, 0.6) 100%);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-visual img { width: 80px; height: auto; opacity: 0.9; }

    /* ----- Partie droite (formulaire) ----- */
    .login-right {
      width: 480px;
      min-height: 100vh;
      background: var(--white);
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: -4px 0 24px rgba(0,0,0,0.06);
    }
    .login-right h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray);
      margin-bottom: 0.5rem;
    }
    .login-right .subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray);
      background: var(--white);
      border: 1px solid var(--gray-light);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .btn-google svg { width: 20px; height: 20px; }
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #94a3b8;
      font-size: 0.875rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-light);
    }
    .divider span { padding: 0 1rem; }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      color: var(--gray);
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--offi-teal);
      box-shadow: 0 0 0 3px rgba(90, 144, 148, 0.15);
    }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-wrap input { width: auto; }
    .checkbox-wrap label { margin: 0; font-size: 0.9rem; color: var(--gray); cursor: pointer; }
    .forgot {
      font-size: 0.9rem;
      color: var(--offi-teal);
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--white);
      background: var(--offi-teal);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-submit:hover {
      background: #4a7a7e;
      transform: translateY(-1px);
    }
    .signup-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #64748b;
    }
    .signup-link a {
      color: var(--offi-teal);
      font-weight: 600;
      text-decoration: none;
    }
    .signup-link a:hover { text-decoration: underline; }
    .back-home {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 0.9rem;
      color: #64748b;
      text-decoration: none;
    }
    .back-home:hover { color: var(--offi-teal); }
    .auth-error {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 0.9rem;
      border-radius: 8px;
      display: none;
    }
    .auth-error.visible { display: block; }
    .auth-loading { opacity: 0.7; pointer-events: none; }
    #inscription-section { display: none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-light); }
    #inscription-section.visible { display: block; }
    .password-reset-form { display: none; margin-top: 1rem; }
    .password-reset-form.visible { display: block; }
    .btn-secondary { background: var(--gray-light); color: var(--gray); border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .login-left {
        min-height: auto;
        padding: 2rem;
        text-align: center;
      }
      .login-left p { margin-left: auto; margin-right: auto; }
      .login-visual { margin-left: auto; margin-right: auto; }
      .login-right {
        width: 100%;
        min-height: auto;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-left">
    <a href="index.html">
      <img src="../assets/icons/logo%20sans%20texte.png" alt="Offibox">
    </a>
    <h1>Bienvenue sur <span class="highlight">Offibox</span></h1>
    <p>Connectez-vous pour accéder à votre espace et télécharger l'application. Utilisez votre compte Google ou votre adresse e-mail.</p>
    <div class="login-visual">
      <img src="../assets/icons/logo%20sans%20texte.png" alt="">
    </div>
  </div>

  <div class="login-right">
    <a href="index.html" class="back-home">← Retour à l'accueil</a>
    <h2>Connexion</h2>
    <p class="subtitle">Accédez à votre compte Offibox</p>

    <div id="auth-error" class="auth-error" role="alert"></div>
    <form id="login-form" action="#" method="post">
      <button type="button" class="btn-google" id="btn-google" aria-label="Se connecter avec Google">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Se connecter avec Google
      </button>

      <div class="divider"><span>ou</span></div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="vous@exemple.fr" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="form-row">
        <div class="checkbox-wrap">
          <input type="checkbox" id="remember" name="remember" checked>
          <label for="remember">Se souvenir de moi</label>
        </div>
        <a href="#" class="forgot" id="forgot-link">Mot de passe oublié ?</a>
      </div>
      <div id="password-reset-form" class="password-reset-form">
        <div class="form-group">
          <label for="reset-email">E-mail pour réinitialiser</label>
          <input type="email" id="reset-email" placeholder="vous@exemple.fr">
        </div>
        <button type="button" class="btn-submit" id="btn-send-reset">Envoyer le lien</button>
        <button type="button" class="btn-secondary" id="btn-cancel-reset" style="margin-top:0.5rem;">Annuler</button>
      </div>
      <button type="submit" class="btn-submit" id="btn-submit">Se connecter</button>
    </form>

    <div id="inscription-section">
      <h2 style="font-size:1.25rem;margin-bottom:1rem;">Créer un compte</h2>
      <form id="signup-form" action="#" method="post">
        <div class="form-group">
          <label for="signup-email">Adresse e-mail</label>
          <input type="email" id="signup-email" name="signup-email" placeholder="vous@exemple.fr" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Mot de passe (min. 6 caractères)</label>
          <input type="password" id="signup-password" name="signup-password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirmer le mot de passe</label>
          <input type="password" id="signup-confirm" placeholder="••••••••" autocomplete="new-password" required minlength="6">
        </div>
        <button type="submit" class="btn-submit">S'inscrire</button>
      </form>
    </div>

    <p class="signup-link">
      Pas encore de compte ? <a href="#inscription" id="toggle-signup">S'inscrire</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script>
    (function() {
      var authError = document.getElementById('auth-error');
      var loginForm = document.getElementById('login-form');
      var btnGoogle = document.getElementById('btn-google');
      var btnSubmit = document.getElementById('btn-submit');
      var inscriptionSection = document.getElementById('inscription-section');
      var toggleSignup = document.getElementById('toggle-signup');
      var signupForm = document.getElementById('signup-form');
      var forgotLink = document.getElementById('forgot-link');
      var passwordResetForm = document.getElementById('password-reset-form');
      var btnSendReset = document.getElementById('btn-send-reset');
      var btnCancelReset = document.getElementById('btn-cancel-reset');

      function showError(msg) {
        if (authError) {
          authError.textContent = msg || '';
          authError.classList.toggle('visible', !!msg);
        }
      }

      function setLoading(loading) {
        loginForm.classList.toggle('auth-loading', loading);
        if (btnGoogle) btnGoogle.disabled = loading;
        if (btnSubmit) btnSubmit.disabled = loading;
      }

      function goToAgenda() {
        window.location.href = 'autorisation-agenda.html';
      }

      // Déjà connecté (Firebase) -> autorisation agenda
      if (window.OffiboxAuth) {
        var user = OffiboxAuth.getCurrentUser();
        if (user) {
          goToAgenda();
          return;
        }
        OffiboxAuth.onAuthStateChanged(function(u) {
          if (u) goToAgenda();
        });
      }

      if (btnGoogle) {
        btnGoogle.addEventListener('click', function() {
          if (!window.OffiboxAuth) { goToAgenda(); return; }
          showError('');
          setLoading(true);
          OffiboxAuth.signInWithGoogle()
            .then(goToAgenda)
            .catch(function(err) {
              setLoading(false);
              var code = err && err.code;
              var msg = 'Connexion Google impossible. Réessayez.';
              if (code === 'auth/popup-closed-by-user') msg = 'Connexion annulée.';
              else if (code === 'auth/popup-blocked') msg = 'Popup bloquée. Autorisez les popups pour ce site.';
              else if (err && err.message) msg = err.message;
              showError(msg);
            });
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          if (!window.OffiboxAuth) { goToAgenda(); return; }
          var email = document.getElementById('email').value.trim();
          var password = document.getElementById('password').value;
          if (!email || !password) { showError('Veuillez remplir l\'email et le mot de passe.'); return; }
          showError('');
          setLoading(true);
          OffiboxAuth.signInWithEmailPassword(email, password)
            .then(goToAgenda)
            .catch(function(err) {
              setLoading(false);
              var code = err && err.code;
              var msg = 'Connexion impossible. Vérifiez vos identifiants.';
              if (code === 'auth/user-not-found' || code === 'auth/wrong-password') msg = 'E-mail ou mot de passe incorrect.';
              else if (code === 'auth/invalid-email') msg = 'Adresse e-mail invalide.';
              else if (err && err.message) msg = err.message;
              showError(msg);
            });
        });
      }

      if (toggleSignup) {
        toggleSignup.addEventListener('click', function(e) {
          e.preventDefault();
          inscriptionSection.classList.toggle('visible');
          loginForm.style.display = inscriptionSection.classList.contains('visible') ? 'none' : 'block';
          toggleSignup.textContent = inscriptionSection.classList.contains('visible') ? 'Déjà un compte ? Se connecter' : 'S\'inscrire';
          showError('');
        });
      }

      if (signupForm) {
        signupForm.addEventListener('submit', function(e) {
          e.preventDefault();
          var email = document.getElementById('signup-email').value.trim();
          var pwd = document.getElementById('signup-password').value;
          var confirm = document.getElementById('signup-confirm').value;
          if (pwd !== confirm) { showError('Les deux mots de passe ne correspondent pas.'); return; }
          if (pwd.length < 6) { showError('Le mot de passe doit faire au moins 6 caractères.'); return; }
          showError('');
          setLoading(true);
          OffiboxAuth.signUpWithEmailPassword(email, pwd)
            .then(goToAgenda)
            .catch(function(err) {
              setLoading(false);
              var code = err && err.code;
              var msg = 'Inscription impossible. Réessayez.';
              if (code === 'auth/email-already-in-use') msg = 'Un compte existe déjà avec cet e-mail.';
              else if (code === 'auth/invalid-email') msg = 'Adresse e-mail invalide.';
              else if (err && err.message) msg = err.message;
              showError(msg);
            });
        });
      }

      if (forgotLink) {
        forgotLink.addEventListener('click', function(e) {
          e.preventDefault();
          passwordResetForm.classList.add('visible');
        });
      }
      if (btnCancelReset) {
        btnCancelReset.addEventListener('click', function() {
          passwordResetForm.classList.remove('visible');
          document.getElementById('reset-email').value = '';
        });
      }
      if (btnSendReset) {
        btnSendReset.addEventListener('click', function() {
          var email = document.getElementById('reset-email').value.trim();
          if (!email) { showError('Indiquez votre adresse e-mail.'); return; }
          showError('');
          OffiboxAuth.sendPasswordResetEmail(email)
            .then(function() {
              showError('Un lien de réinitialisation a été envoyé à votre adresse.');
              passwordResetForm.classList.remove('visible');
            })
            .catch(function(err) {
              var code = err && err.code;
              if (code === 'auth/user-not-found') showError('Aucun compte avec cet e-mail.');
              else showError(err && err.message ? err.message : 'Envoi impossible.');
            });
        });
      }
    })();
  </script>
</body>
</html>

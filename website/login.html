<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Offibox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --accent: #38bdf8;
      --accent-soft: #7dd3fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --white: #ffffff;
      --gray: #334155;
      --gray-light: #e2e8f0;
      --offi-teal: #5A9094;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
    }

    /* ----- Partie gauche (même style que page d'accueil) ----- */
    .login-left {
      flex: 1;
      background: var(--bg-dark);
      padding: 3rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-left a {
      display: inline-block;
      margin-bottom: 3rem;
    }
    .login-left img {
      height: 36px;
      width: auto;
    }
    .login-left h1 {
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 1rem;
    }
    .login-left h1 .highlight { color: var(--accent); }
    .login-left p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 380px;
      line-height: 1.7;
    }
    .login-visual {
      margin-top: 3rem;
      width: 200px;
      height: 200px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(15, 23, 42, 0.6) 100%);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-visual img { width: 80px; height: auto; opacity: 0.9; }

    /* ----- Partie droite (formulaire) ----- */
    .login-right {
      width: 480px;
      min-height: 100vh;
      background: var(--white);
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: -4px 0 24px rgba(0,0,0,0.06);
    }
    .login-right h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray);
      margin-bottom: 0.5rem;
    }
    .login-right .subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray);
      background: var(--white);
      border: 1px solid var(--gray-light);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .btn-google svg { width: 20px; height: 20px; }
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #94a3b8;
      font-size: 0.875rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-light);
    }
    .divider span { padding: 0 1rem; }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      color: var(--gray);
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--offi-teal);
      box-shadow: 0 0 0 3px rgba(90, 144, 148, 0.15);
    }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-wrap input { width: auto; }
    .checkbox-wrap label { margin: 0; font-size: 0.9rem; color: var(--gray); cursor: pointer; }
    .forgot {
      font-size: 0.9rem;
      color: var(--offi-teal);
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--white);
      background: var(--offi-teal);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-submit:hover {
      background: #4a7a7e;
      transform: translateY(-1px);
    }
    .signup-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #64748b;
    }
    .signup-link a {
      color: var(--offi-teal);
      font-weight: 600;
      text-decoration: none;
    }
    .signup-link a:hover { text-decoration: underline; }
    .back-home {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 0.9rem;
      color: #64748b;
      text-decoration: none;
    }
    .back-home:hover { color: var(--offi-teal); }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .login-left {
        min-height: auto;
        padding: 2rem;
        text-align: center;
      }
      .login-left p { margin-left: auto; margin-right: auto; }
      .login-visual { margin-left: auto; margin-right: auto; }
      .login-right {
        width: 100%;
        min-height: auto;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-left">
    <a href="index.html">
      <img src="../assets/icons/logo%20sans%20texte.png" alt="Offibox">
    </a>
    <h1>Bienvenue sur <span class="highlight">Offibox</span></h1>
    <p>Connectez-vous pour accéder à votre espace et télécharger l'application. Utilisez votre compte Google ou votre adresse e-mail.</p>
    <div class="login-visual">
      <img src="../assets/icons/logo%20sans%20texte.png" alt="">
    </div>
  </div>

  <div class="login-right">
    <a href="index.html" class="back-home">← Retour à l'accueil</a>
    <h2>Connexion</h2>
    <p class="subtitle">Accédez à votre compte Offibox</p>

    <form id="login-form" action="#" method="post">
      <button type="button" class="btn-google" id="btn-google" aria-label="Se connecter avec Google">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Se connecter avec Google
      </button>

      <div class="divider"><span>ou</span></div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="vous@exemple.fr" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="form-row">
        <div class="checkbox-wrap">
          <input type="checkbox" id="remember" name="remember" checked>
          <label for="remember">Se souvenir de moi</label>
        </div>
        <a href="#" class="forgot">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn-submit">Se connecter</button>
    </form>

    <p class="signup-link">
      Pas encore de compte ? <a href="login.html#inscription">S'inscrire</a>
    </p>
  </div>

  <script>
    const privateSpaceUrl = 'https://www.offibox.fr/espace-priv%C3%A9';

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      // Ici on simule une connexion réussie, puis on envoie l'utilisateur vers l'espace privé.
      window.location.href = privateSpaceUrl;
    });

    document.getElementById('btn-google').addEventListener('click', function () {
      // Idem : clic sur Google = redirection vers l'espace privé.
      window.location.href = privateSpaceUrl;
    });
  </script>
</body>
</html>

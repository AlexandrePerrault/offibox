name: offibox
description: Offibox desktop search bar
publish_to: "none"

version: 1.1.16

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 🧠 State management
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  device_info_plus: ^9.0.2
  package_info_plus: ^8.1.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^6.2.1
  # 🧊 Modèles / JSON
  freezed_annotation: 2.4.4
  json_annotation: ^4.9.0
  cloud_functions: ^6.0.6
  # 🌐 Réseau / fichiers
  path: ^1.9.0
  http: ^1.2.0
  oauth2: ^2.0.5
  csv: ^6.0.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # 🪟 Desktop / système
  bitsdojo_window: ^0.1.5
  window_manager: ^0.5.1
  tray_manager: ^0.2.1
  win32: ^5.5.0
  win32_registry: ^1.1.5

  # 🔗 UI / Liens
  url_launcher: ^6.3.0
  protocol_handler: ^0.2.0
  flutter_svg: ^2.0.10
  webview_windows: ^0.4.0
  youtube_player_iframe: ^5.2.2
  google_fonts: ^7.1.0

  # 📄 PDF (pdfrx - MIT, basé sur PDFium)
  pdfrx: ^2.2.24
  printing: ^5.13.0

  # 🆔 Utils
  uuid: ^4.5.1
  collection: ^1.18.0

  # 📷 Scan
  mobile_scanner: ^7.1.4

  # 💾 Cache local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ✨ Animations
  flutter_animate: ^4.5.0

  pdfrx_engine: any
dev_dependencies:
  pdf: ^3.10.7
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/google_logo.svg
    - assets/icons/logo_offibox.png
    - assets/icons/logo_offibox_text.png
    - assets/icons/logo text.png
    - assets/icons/logo_offibox_installer.png
    - assets/debug/
    - assets/pdf/

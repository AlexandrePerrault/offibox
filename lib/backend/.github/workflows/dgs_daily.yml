name: Fetch DGS Urgent (daily)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  fetch-dgs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run DGS fetch script
        run: |
          python fetch_latest_dgs_urgent.py

      - name: Commit updated JSON (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest_dgs_urgent.json
          git commit -m "Daily update DGS-Urgent" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/AlexandrePerrault/offiboxdata.git

# Release automatique : au push d’un tag v* (ex. v1.0.12), build Windows + MSI puis création de la release GitHub avec le MSI en pièce jointe.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup 6
        run: choco install innosetup -y

      - name: Get version from pubspec.yaml
        id: version
        run: |
          $v = (Get-Content pubspec.yaml | Select-String '^\s*version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "Version: $v"

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" installer/Offibox.iss

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: website/download/*.exe
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Build iOS (gratuit sur GitHub Actions - 2000 min/mois si repo privé, illimité si public)
# Pour installer sur ton iPad : voir section "Installation sur l'iPad" en bas du fichier

name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permet de lancer le build à la main (Actions > Build iOS > Run workflow)

jobs:
  build:
    runs-on: macos-latest  # Un Mac virtuel (obligatoire pour compiler iOS)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # pdfrx ^2.2.24 exige Flutter >= 3.35.1
          flutter-version: "3.41.4"
          channel: "stable"
          cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Restaurer les paquets
        run: flutter pub get

      # Cache CocoaPods pour accélérer pod install (surtout après le 1er run)
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-ios-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-ios-pods-

      # Forcer la cible iOS 15.0 (requise par cloud_firestore) dans le projet Xcode
      - name: Fixer deployment target iOS 15.0
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PBX"
            grep "IPHONEOS_DEPLOYMENT_TARGET" "$PBX" || true
            echo "Deployment target forcé à 15.0"
          fi

      # CocoaPods exige "platform :ios, '15.0'" dans le Podfile (sinon il utilise 13.0)
      - name: Forcer platform iOS 15.0 dans Podfile
        run: |
          PODFILE="ios/Podfile"
          if [ ! -f "$PODFILE" ]; then
            echo "::error::Podfile absent dans ios/"
            exit 1
          fi
          # Supprimer toute ligne platform :ios existante (commentée ou non)
          sed -i '' '/^[[:space:]]*#*[[:space:]]*platform[[:space:]]*:ios/d' "$PODFILE"
          # Ajouter platform :ios, '15.0' en première ligne
          printf "platform :ios, '15.0'\n\n" | cat - "$PODFILE" > "${PODFILE}.tmp" && mv "${PODFILE}.tmp" "$PODFILE"
          echo "--- Premières lignes du Podfile ---"
          head -8 "$PODFILE"
          echo "---"

      # Fichier Firebase pour iOS (optionnel en CI : sans lui la build peut échouer si le code le requiert)
      - name: Vérifier GoogleService-Info.plist (optionnel)
        run: |
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "GoogleService-Info.plist présent"
          else
            echo "::warning::GoogleService-Info.plist absent. Crée une app iOS dans Firebase et place le fichier dans ios/Runner/"
          fi

      - name: Build iOS (sans signature)
        run: flutter build ios --no-codesign
        env:
          FLUTTER_GIT_URL: https://github.com/flutter/flutter.git

      - name: Archiver le build
        run: |
          cd build/ios/iphoneos
          zip -r ../../../ios-build.zip Runner.app
          cd ../../..

      - name: Déposer le build en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios-build.zip

# Build Flutter web (Offibox version web) et déploiement sur GitHub Pages.
# Une fois activé, l'app est disponible à https://<owner>.github.io/offibox/
# Activer GitHub Pages : Settings → Pages → Source = "GitHub Actions".
name: Deploy Offibox Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Token offiboxdata : secret OFFIBOXDATA_GITHUB_TOKEN (PAT GitHub, scope repo).
      # Sans ce secret, le repo offiboxdata doit être public pour que la recherche web affiche des résultats.
      - name: Build web (entry point main_web)
        env:
          OFFIBOXDATA_TOKEN: ${{ secrets.OFFIBOXDATA_GITHUB_TOKEN }}
        run: |
          if [ -n "$OFFIBOXDATA_TOKEN" ]; then
            flutter build web -t lib/main_web.dart --base-href /offibox/ --release --no-wasm-dry-run \
              --dart-define=OFFIBOXDATA_GITHUB_TOKEN="$OFFIBOXDATA_TOKEN"
          else
            flutter build web -t lib/main_web.dart --base-href /offibox/ --release --no-wasm-dry-run
          fi

      # Pages statiques (login, inscription, validation, démo) pour iframes Wix / app
      - name: Copy static HTML to build
        run: cp -r website/pages/html build/web/html

      # Tout le dossier website (tous les HTML) pour GitHub Pages
      - name: Copy full website to build
        run: cp -r website build/web/website

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
